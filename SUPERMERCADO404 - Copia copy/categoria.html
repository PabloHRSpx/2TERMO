<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorias - Supermercado 404</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="imagens/favicon-404.png">
</head>
<body>
    <header>
        <h1>Supermercado 404</h1>

        <nav aria-label="Navegação principal">
            <a class="brand-logo" href="index.html#inicio" aria-label="Supermercado 404 - Início">
                <img src="imagens/logo-404.png" alt="Logo do Supermercado 404">
            </a>
            <a href="index.html#inicio">Início</a>
            <a href="categoria.html">Categorias</a>
            <a href="index.html#promocoes">Promoções</a>
            <form class="search-form" role="search">
                <label for="search-input" class="visually-hidden">Pesquisar produtos</label>
                <input id="search-input" type="search" placeholder="Pesquisar produto">
                <button type="submit" aria-label="Pesquisar">⌕</button>
            </form>

            <details class="menu-dropdown">
                <summary>Mais ▼</summary>
                <div class="dropdown-content">
                    <a href="index.html#cupons">Cupons</a>
                    <a href="index.html#carrinho">Carrinho (<span id="cart-count">0</span>)</a>
                    <a href="index.html#pedido">Lista de compras</a>
                    <a href="#contato">Contato</a>
                </div>
            </details>
        </nav>
    </header>

    <main id="categorias-pagina">
        <section>
            <h2>Todas as Categorias</h2>
            <div id="lista-categorias-banco" class="cards">
                <!-- Os produtos e categorias serão renderizados aqui pelo banco.js -->
            </div>
        </section>
    </main>

    <footer id="contato">
        <h2>Contato</h2>
        <p>Supermercado 404</p>
        <p>Telefone: (11) 99999-9999</p>
        <p>E-mail: contato@rapi10.com</p>
        <p>Endereço: Rua Principal, 100 - Centro</p>
        <p>&copy; 2026 Supermercado 404</p>
    </footer>

    <script src="banco.js" defer></script>
    <script src="script.js" defer></script>
</body>
</html>
