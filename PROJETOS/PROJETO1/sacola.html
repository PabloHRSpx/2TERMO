<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Sacola</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background-color: #f5f5f5; }

        header {
            background-color: #2e7d32;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 { font-size: 1.5em; }
        nav a { color: white; text-decoration: none; margin-left: 20px; }
        nav a:hover { text-decoration: underline; }

        .container { max-width: 600px; margin: 30px auto; padding: 0 20px; }

        .sacola-item {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .sacola-item .info { flex: 1; }
        .sacola-item .info strong { display: block; margin-bottom: 4px; }
        .sacola-item .info p { font-size: 0.9em; color: #666; }
        .sacola-item .qtd { display: flex; align-items: center; gap: 10px; }
        .sacola-item .qtd button {
            width: 30px; height: 30px;
            border: 1px solid #ccc;
            background: white;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.1em;
        }
        .sacola-item .qtd button:hover { background: #eee; }
        .sacola-item .remover {
            background: none;
            border: none;
            color: #d32f2f;
            cursor: pointer;
            font-size: 1.2em;
            margin-left: 10px;
        }

        .sacola-vazia {
            text-align: center;
            color: #999;
            padding: 60px 0;
            font-size: 1.2em;
        }

        .total-box {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .total-box .linha {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .total-box .linha.total {
            font-size: 1.3em;
            font-weight: bold;
            color: #2e7d32;
            border-top: 2px solid #eee;
            padding-top: 10px;
        }

        .btn-checkout {
            display: block;
            width: 100%;
            background: #2e7d32;
            color: white;
            text-decoration: none;
            text-align: center;
            padding: 14px;
            border-radius: 5px;
            font-size: 1.1em;
            margin-top: 15px;
        }
        .btn-checkout:hover { background: #1b5e20; }
        .btn-voltar {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #666;
            text-decoration: none;
        }

        footer {
            background-color: #2e7d32;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
        }
    </style>
</head>
<body>

<header>
    <h1>🛒 Supermercado Econômico</h1>
    <nav>
        <a href="index.html">← Voltar à Loja</a>
    </nav>
</header>

<div class="container">
    <h2 style="color:#2e7d32; margin-bottom:20px;">🛍️ Minha Sacola</h2>
    <div id="sacola-itens"></div>

    <div class="total-box" id="total-box" style="display:none;">
        <div class="linha">
            <span>Itens:</span>
            <span id="total-itens">0</span>
        </div>
        <div class="linha total">
            <span>Total:</span>
            <span id="sacola-total">R$ 0,00</span>
        </div>
        <a href="checkout.html" class="btn-checkout">Finalizar Compra →</a>
    </div>

    <a href="index.html" class="btn-voltar">← Continuar comprando</a>
</div>

<footer>
    <p>&copy; 2026 Supermercado Econômico | Av. Central, 123 - São Paulo/SP</p>
</footer>

<script>
    let sacola = JSON.parse(localStorage.getItem("sacola")) || [];

    function salvarSacola() {
        localStorage.setItem("sacola", JSON.stringify(sacola));
    }

    function renderizar() {
        const container = document.getElementById("sacola-itens");
        const totalBox = document.getElementById("total-box");

        if (sacola.length === 0) {
            container.innerHTML = '<p class="sacola-vazia">Sua sacola está vazia 🛒</p>';
            totalBox.style.display = "none";
        } else {
            container.innerHTML = sacola.map(i => `
                <div class="sacola-item">
                    <div class="info">
                        <strong>${i.nome}</strong>
                        <p>R$ ${(i.preco * i.qtd).toFixed(2).replace('.', ',')}</p>
                    </div>
                    <div class="qtd">
                        <button onclick="alterarQtd(${i.id}, -1)">−</button>
                        <span>${i.qtd}</span>
                        <button onclick="alterarQtd(${i.id}, 1)">+</button>
                    </div>
                    <button class="remover" onclick="remover(${i.id})">🗑️</button>
                </div>
            `).join("");
            totalBox.style.display = "block";
        }

        const total = sacola.reduce((s, i) => s + i.preco * i.qtd, 0);
        const totalQtd = sacola.reduce((s, i) => s + i.qtd, 0);
        document.getElementById("sacola-total").textContent = `R$ ${total.toFixed(2).replace('.', ',')}`;
        document.getElementById("total-itens").textContent = totalQtd;
    }

    function alterarQtd(id, delta) {
        const item = sacola.find(i => i.id === id);
        if (item) {
            item.qtd += delta;
            if (item.qtd <= 0) sacola = sacola.filter(i => i.id !== id);
        }
        salvarSacola();
        renderizar();
    }

    function remover(id) {
        sacola = sacola.filter(i => i.id !== id);
        salvarSacola();
        renderizar();
    }

    renderizar();
</script>

</body>
</html>
